// The signing key comes from the environment at build time (build.sh loads
// ~/.secrets/box-breathing.env); nothing secret is in this repo. Without it the release
// APK is left unsigned, which is what F-Droid's build server wants (it signs its own).
plugins { id "com.android.application" }

def keystore = System.getenv("KEYSTORE_FILE")

android {
    namespace "dev.cosmoslab.boxbreathing"
    compileSdk 35
    buildToolsVersion "35.0.0"   // the one the build image ships
    defaultConfig {
        applicationId "dev.cosmoslab.boxbreathing"
        minSdk 29
        targetSdk 35
        // bump both for each release and tag it vX.Y.Z; F-Droid reads them from here
        versionCode 4
        versionName "1.0.2"
    }
    signingConfigs {
        if (keystore) {
            release {
                storeFile file(keystore)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "boxbreathing"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystore) signingConfig signingConfigs.release
        }
    }
    // Google's encrypted dependency blob in the signing block; F-Droid rejects APKs that carry it
    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
